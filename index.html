<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1208" />
    <title>總舖師傳奇</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="game">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">料理經營</p>
          <h1>總舖師傳奇</h1>
        </div>
        <button type="button" id="sound-btn" class="icon-btn" aria-pressed="true">♫</button>
      </header>

      <section id="intro" class="panel intro">
        <p>研發菜色、排班出餐、累積資金展店。破產或名聲歸零即敗；開第二間店即勝。</p>
        <button type="button" id="start-btn" class="primary">開始營業</button>
        <a class="link" href="./ATTRIBUTION.md">素材署名</a>
      </section>

      <section id="play" hidden>
        <div id="hud" class="hud" aria-live="polite"></div>
        <p id="toast" class="toast" aria-live="polite"></p>

        <div id="kitchen" class="kitchen">
          <div class="kitchen-head">
            <h2>出餐台</h2>
            <span id="shift-timer"></span>
          </div>
          <div id="orders" class="orders"></div>
        </div>

        <div id="plan" class="plan">
          <h2>店務</h2>
          <div id="plan-actions" class="actions"></div>
        </div>

        <div id="menu-lab" class="menu-lab">
          <h2>菜單研發</h2>
          <div id="recipes" class="recipes"></div>
        </div>

        <div id="overlay" class="overlay" hidden>
          <div class="overlay-card">
            <h2 id="overlay-title"></h2>
            <p id="overlay-msg"></p>
            <button type="button" id="overlay-btn" class="primary">再來一局</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
